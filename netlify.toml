# ── Netlify config — place this in your frontend/ directory ───────

[build]
  # Run from the frontend folder
  base    = "frontend"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# SPA routing — send all paths to index.html so React Router works
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200