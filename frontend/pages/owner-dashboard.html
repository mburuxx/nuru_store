<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" href="/css/main.css" />
  <title>Owner Dashboard</title>
</head>
<body>
  <header class="topbar">
    <div>
      <strong>Owner Dashboard</strong>
      <span id="who" class="muted"></span>
    </div>
    <button id="logoutBtn">Logout</button>
  </header>

  <main class="container">
    <section class="grid">
      <div class="panel">
        <h2>Stock overview</h2>
        <p class="muted">Total items, low-stock alerts, etc (we’ll wire later).</p>
      </div>
      <div class="panel">
        <h2>Recent sales</h2>
        <p class="muted">Last transactions, revenue summary, etc.</p>
      </div>
      <div class="panel">
        <h2>Alerts</h2>
        <p class="muted">Sales made + below 10% stock notifications.</p>
      </div>
    </section>
  </main>

  <script type="module">
    import { requireRole, handleLogoutClick } from "/js/auth/guard.js";

    const who = document.querySelector("#who");

    const profile = await requireRole(["OWNER"]);
    if (profile) {
      who.textContent = `— ${profile.username}`;
      handleLogoutClick("#logoutBtn");
    }
  </script>
</body>
</html>
