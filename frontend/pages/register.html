<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" href="/css/main.css" />
  <title>Register</title>
</head>
<body>
  <main class="card">
    <h1>Create cashier account</h1>

    <form id="registerForm">
      <label>Username
        <input name="username" required />
      </label>

      <label>Email (optional)
        <input name="email" type="email" />
      </label>

      <label>Phone (optional)
        <input name="phone" />
      </label>

      <label>Password
        <input name="password" type="password" minlength="6" required />
      </label>

      <button type="submit">Register</button>
      <p class="muted">Already have an account? <a href="/index.html">Login</a></p>

      <p id="msg" class="msg"></p>
    </form>
  </main>

  <script type="module">
    import { register, getProfile } from "/js/api/users.js";

    const form = document.querySelector("#registerForm");
    const msg = document.querySelector("#msg");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      msg.textContent = "";

      const fd = new FormData(form);
      const payload = {
        username: fd.get("username"),
        email: fd.get("email") || "",
        phone: fd.get("phone") || "",
        password: fd.get("password"),
      };

      try {
        await register(payload);
        const profile = await getProfile();
        window.location.href = profile.role === "OWNER"
          ? "/pages/owner-dashboard.html"
          : "/pages/cashier-dashboard.html";
      } catch (err) {
        msg.textContent = err.message || "Registration failed";
      }
    });
  </script>
</body>
</html>
