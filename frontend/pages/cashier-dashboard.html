<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" href="/css/main.css" />
  <title>Cashier Dashboard</title>
</head>
<body>
  <header class="topbar">
    <div>
      <strong>Cashier Dashboard</strong>
      <span id="who" class="muted"></span>
    </div>
    <button id="logoutBtn">Logout</button>
  </header>

  <main class="container">
    <section class="grid">
      <div class="panel">
        <h2>New Sale</h2>
        <p class="muted">Create a sale, add items, issue receipt (we’ll wire next).</p>
      </div>
      <div class="panel">
        <h2>My recent transactions</h2>
        <p class="muted">Your last sales and receipt links.</p>
      </div>
    </section>
  </main>

  <script type="module">
    import { requireRole, handleLogoutClick } from "/js/auth/guard.js";

    const who = document.querySelector("#who");

    const profile = await requireRole(["CASHIER", "OWNER"]); // owner can access cashier if you want; if not, remove OWNER
    if (profile) {
      who.textContent = `— ${profile.username}`;
      handleLogoutClick("#logoutBtn");
    }
  </script>
</body>
</html>
