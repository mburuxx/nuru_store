server {
    listen 80;
    server_name _;

    # FRONTEND (static files)
    root /usr/share/nginx/html;
    index index.html;

    # Cache-bust: cache assets hard, but NOT html
    location ~* \.(?:css|js|mjs|map|png|jpg|jpeg|gif|svg|ico|webp|woff2?|ttf|eot)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        access_log off;
    }

    # Updates deploy cleanly
    location ~* \.(?:html)$ {
        try_files $uri =404;
        add_header Cache-Control "no-store";
    }

    # Main site routing:
    location / {
        try_files $uri $uri/ /index.html;
    }

    # BACKEND API (DRF)
    location /api/ {
        proxy_pass http://backend:8000;

        # Standard reverse proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Stable keep-alive behavior
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Uploads / timeouts
        client_max_body_size 20m;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
    }

    location /admin/ {
        proxy_pass http://backend:8000/admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }


    # Defaults
    server_tokens off;

    # If you ever start using WebSockets later, this is harmless to keep:
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
}